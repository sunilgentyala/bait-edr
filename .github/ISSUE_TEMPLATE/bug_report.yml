name: Bug report
description: Report a reproducible BAIT defect
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Remove credentials, tokens, personal data, customer identifiers, and production telemetry before submitting.

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: State the observed and expected behavior.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest safe sequence that reproduces the defect.
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Ubuntu 24.04, Python 3.13, BAIT 0.2.1
    validations:
      required: true

  - type: dropdown
    id: response_mode
    attributes:
      label: Response mode
      options:
        - audit
        - active
        - not applicable
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      render: shell
