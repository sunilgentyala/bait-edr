# Administrative BAIT API, private network only.
# Add production TLS, identity-aware authentication, request limits, audit logs,
# and network controls appropriate for the deployment.
location /bait/api/ {
    proxy_pass http://127.0.0.1:8765/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;

    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;
}

# Recommended pattern for the public website widget:
# implement /bait/public-health in your application or gateway, fetch BAIT data
# server-side, and return only status, alerts, and response_mode. Do not proxy
# the administrative /health endpoint directly to the public internet.
